<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:* https://*; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federico — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../shared/design-tokens.css" />
    <link rel="stylesheet" href="../shared/material-components.css" />
    <link rel="stylesheet" href="../shared/ui-feedback.css" />
    <link rel="stylesheet" href="login-page.css" />
</head>

<body>
    <header class="topbar">
        <a href="../landing/landing-page.html" class="brand" title="Back to Home">
            <div class="brand-icon">F</div>
            <div class="brand-name">Federico Cloud</div>
        </a>
    </header>

    <main class="login-wrapper">
        <div class="md-blur-shape md-blur-primary" style="width:420px;height:420px;top:-120px;left:-160px;" aria-hidden="true"></div>
        <div class="md-blur-shape md-blur-tertiary" style="width:340px;height:340px;bottom:-100px;right:-140px;" aria-hidden="true"></div>

        <section class="login-card">
            <div class="card-head">
                <h1 class="card-title">Sign In</h1>
                <p class="card-subtitle">Select your role to access your portal</p>
            </div>

            <div class="role-tabs">
                <button class="role-tab active" type="button">Patient</button>
                <button class="role-tab" type="button">PRE</button>
                <button class="role-tab" type="button">HOM</button>
                <button class="role-tab" type="button">FA</button>
                <button class="role-tab" type="button">Admin</button>
            </div>

            <form id="login-form" class="login-form">
                <div id="login-error" class="login-error" aria-live="polite"></div>

                <div class="form-group">
                    <label for="organization">Hospital</label>
                    <select id="organization">
                        <option value="">Loading hospitals…</option>
                    </select>
                    <span class="field-hint">Patients: choose your registered hospital. <a href="../marketplace/marketplace-page.html">Browse all</a>.</span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" required />
                </div>

                <div class="form-row">
                    <label class="checkbox-wrap">
                        <input type="checkbox" id="remember-me" />
                        <span>Remember me</span>
                    </label>

                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button class="login-btn primary-btn login-submit" type="submit">Sign In</button>
            </form>

            <div class="demo-credential-card">
                <div class="demo-credential-title">Demo Access</div>
                <div class="demo-credential-copy">Click any account below to autofill demo credentials:</div>
                <div id="login-credential-helper" class="demo-credential-list"></div>
            </div>
        </section>

    </main>

    <script src="../shared/constants.js"></script>
    <script src="../shared/api-client.js"></script>
    <script src="../shared/rbac.js"></script>
    <script src="../shared/ui-feedback.js"></script>
    <script src="login-page.js"></script>
</body>

</html>
